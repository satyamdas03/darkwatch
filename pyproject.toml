[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "darkwatch"
version = "0.1.0"
description = "Maritime dark-vessel detection from Sentinel-1 SAR + AIS with calibrated attribution."
requires-python = ">=3.11"
authors = [{name = "Satyam Das"}]
dependencies = [
    # Geospatial / SAR
    "rasterio>=1.3",
    "geopandas>=1.0",
    "xarray>=2024.1",
    "pyproj>=3.6",
    "shapely>=2.0",
    "pyogrio>=0.7",
    # ML / detection
    "ultralytics>=8.0",
    "torch",
    "torchvision",
    "opencv-python>=4.8",
    # Utils
    "requests>=2.31",
    "httpx>=0.27",
    "numpy>=1.24",
    "scipy>=1.11",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "folium>=0.15",
    "duckdb>=0.10",
    "tqdm>=4.66",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.9",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["darkwatch*"]
