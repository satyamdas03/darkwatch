<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Darkwatch — Analyst Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Saira+Condensed:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <span class="logo" aria-hidden="true">◉</span>
        <h1>Darkwatch</h1>
      </div>
      <div class="controls">
        <label for="scene-select">Scene</label>
        <select id="scene-select"></select>
        <span id="scene-meta" class="scene-meta"></span>
      </div>
    </header>

    <main class="dashboard">
      <section class="filter-bar">
        <div class="filter-group">
          <button class="filter-pill active" data-filter="all">All</button>
          <button class="filter-pill" data-filter="DARK">Dark</button>
          <button class="filter-pill" data-filter="CLEAR">Clear</button>
          <button class="filter-pill" data-filter="ARTIFACT">Artifact</button>
          <button class="filter-pill" data-filter="REVIEW">Review</button>
        </div>
        <div class="stats" id="stats"></div>
      </section>

      <div class="panes">
        <section class="alert-list" id="alert-list">
          <div class="empty">Loading scenes…</div>
        </section>

        <section class="right-rail">
          <div class="map-panel">
            <iframe id="map-frame" title="Scene map"></iframe>
          </div>
          <div class="evidence-panel" id="evidence-panel">
            <div class="empty">Select a contact to view evidence.</div>
          </div>
        </section>
      </div>
    </main>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
